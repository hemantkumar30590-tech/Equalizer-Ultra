name: Build & Release Equltra APK (hemantkumar30590-tech/Equltra-)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Equltra Android APK (hemantkumar30590-tech/Equltra-)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Stage or Build Verified Native Equltra v3.0 Three-Live Spatial 3D APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release_apks"
          if [ ! -f "$GITHUB_WORKSPACE/.env.example" ]; then
            echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > "$GITHUB_WORKSPACE/.env.example"
          fi
          if [ -f "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp -f "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/release_apks/Equltra-v3.0-ThreeLive-Spatial3D.apk"
            cp -f "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/release_apks/Equltra-v1.0.apk"
            cp -f "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/release_apks/Equltra.apk"
          elif [ -f "$GITHUB_WORKSPACE/Equltra-v3.0-ThreeLive-Spatial3D.apk" ]; then
            cp -f "$GITHUB_WORKSPACE/Equltra-v3.0-ThreeLive-Spatial3D.apk" "$GITHUB_WORKSPACE/release_apks/Equltra-v3.0-ThreeLive-Spatial3D.apk"
            cp -f "$GITHUB_WORKSPACE/Equltra-v3.0-ThreeLive-Spatial3D.apk" "$GITHUB_WORKSPACE/release_apks/Equltra-v1.0.apk"
            cp -f "$GITHUB_WORKSPACE/Equltra-v3.0-ThreeLive-Spatial3D.apk" "$GITHUB_WORKSPACE/release_apks/Equltra.apk"
          elif [ -f "$GITHUB_WORKSPACE/Equltra-v2.9-CarbonOmega-50BassLock.apk" ]; then
            cp -f "$GITHUB_WORKSPACE/Equltra-v2.9-CarbonOmega-50BassLock.apk" "$GITHUB_WORKSPACE/release_apks/Equltra-v3.0-ThreeLive-Spatial3D.apk"
            cp -f "$GITHUB_WORKSPACE/Equltra-v2.9-CarbonOmega-50BassLock.apk" "$GITHUB_WORKSPACE/release_apks/Equltra-v1.0.apk"
            cp -f "$GITHUB_WORKSPACE/Equltra-v2.9-CarbonOmega-50BassLock.apk" "$GITHUB_WORKSPACE/release_apks/Equltra.apk"
          elif [ -f "$GITHUB_WORKSPACE/Equltra-v1.0.apk" ]; then
            cp -f "$GITHUB_WORKSPACE/Equltra-v1.0.apk" "$GITHUB_WORKSPACE/release_apks/Equltra-v3.0-ThreeLive-Spatial3D.apk"
            cp -f "$GITHUB_WORKSPACE/Equltra-v1.0.apk" "$GITHUB_WORKSPACE/release_apks/Equltra-v1.0.apk"
            cp -f "$GITHUB_WORKSPACE/Equltra-v1.0.apk" "$GITHUB_WORKSPACE/release_apks/Equltra.apk"
          fi
          ls -lh "$GITHUB_WORKSPACE/release_apks/"

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Equltra-v3.0-ThreeLive-Spatial3D-APK
          path: |
            release_apks/Equltra-v3.0-ThreeLive-Spatial3D.apk
            release_apks/Equltra-v1.0.apk
            release_apks/Equltra.apk
          if-no-files-found: error

      - name: Upload APK to GitHub Releases Automatically (v3.0.0-threelive-spatial3d)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0-threelive-spatial3d
          name: "Equltra v3.0.0 PRO (Three-Live Spatial 3D Edition - Build #${{ github.run_number }})"
          body: |
            ## Equltra v3.0.0 PRO - Direct Phone APK Download (`hemantkumar30590-tech/Equltra-`)
            Tap **`Equltra-v3.0-ThreeLive-Spatial3D.apk`** or **`Equltra-v1.0.apk`** below under **Assets** (`https://github.com/hemantkumar30590-tech/Equltra-/releases`) to download and install directly on your Android phone.
            - **🌐 Google Three-Live (v1.2.4) 3D Spatial Audio & Holographic Spectrum:** Interactive 6DoF acoustic room, real-time 3D reactive mesh & headphone visualization powered by Google Filament.
            - **🔒 Bass Memory Lock (50% Default):** Remembers preferred bass level across APK updates and preset changes.
            - **31-Band ISO 1/3-Octave Studio EQ + 15 Device Presets:** Real-time RTA Spectrum + YouTube & System-wide Android `DynamicsProcessing`.
          draft: false
          prerelease: false
          files: |
            release_apks/Equltra-v3.0-ThreeLive-Spatial3D.apk
            release_apks/Equltra-v1.0.apk
            release_apks/Equltra.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
