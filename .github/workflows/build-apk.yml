name: Build & Release Equltra APK (hemantkumar30590-tech/Equltra-)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Equltra Android APK (hemantkumar30590-tech/Equltra-)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Stage or Build Verified Native Equltra v2.5 Bass-Lock APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release_apks"
          if [ ! -f "$GITHUB_WORKSPACE/.env.example" ]; then
            echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > "$GITHUB_WORKSPACE/.env.example"
          fi
          if [ -f "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp -f "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/release_apks/Equltra-v2.5-BassLock.apk"
            cp -f "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/release_apks/Equltra-v1.0.apk"
            cp -f "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/release_apks/Equltra.apk"
          elif [ -f "$GITHUB_WORKSPACE/Equltra-v2.5-BassLock.apk" ]; then
            cp -f "$GITHUB_WORKSPACE/Equltra-v2.5-BassLock.apk" "$GITHUB_WORKSPACE/release_apks/Equltra-v2.5-BassLock.apk"
            cp -f "$GITHUB_WORKSPACE/Equltra-v2.5-BassLock.apk" "$GITHUB_WORKSPACE/release_apks/Equltra-v1.0.apk"
            cp -f "$GITHUB_WORKSPACE/Equltra-v2.5-BassLock.apk" "$GITHUB_WORKSPACE/release_apks/Equltra.apk"
          elif [ -f "$GITHUB_WORKSPACE/Equltra-v1.0.apk" ]; then
            cp -f "$GITHUB_WORKSPACE/Equltra-v1.0.apk" "$GITHUB_WORKSPACE/release_apks/Equltra-v2.5-BassLock.apk"
            cp -f "$GITHUB_WORKSPACE/Equltra-v1.0.apk" "$GITHUB_WORKSPACE/release_apks/Equltra-v1.0.apk"
            cp -f "$GITHUB_WORKSPACE/Equltra-v1.0.apk" "$GITHUB_WORKSPACE/release_apks/Equltra.apk"
          fi
          ls -lh "$GITHUB_WORKSPACE/release_apks/"

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Equltra-v2.5-BassLock-APK
          path: |
            release_apks/Equltra-v2.5-BassLock.apk
            release_apks/Equltra-v1.0.apk
            release_apks/Equltra.apk
          if-no-files-found: error

      - name: Upload APK to GitHub Releases Automatically (v2.5.0-bass-lock)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.0-bass-lock
          name: "Equltra v2.5.0 PRO (Bass-Lock Edition - Build #${{ github.run_number }})"
          body: |
            ## Equltra v2.5.0 PRO - Direct Phone APK Download (`hemantkumar30590-tech/Equltra-`)
            Tap **`Equltra-v2.5-BassLock.apk`** or **`Equltra-v1.0.apk`** below under **Assets** (`https://github.com/hemantkumar30590-tech/Equltra-/releases`) to download and install directly on your Android phone.
            - **🔒 Bass Memory Lock (Default 25% Smooth Bass):** Remembers your preferred bass level across APK updates, preset changes, AI Auto-EQ, and Future-Gen modes so bass never jumps to 78%–100%.
            - **16 Ultra-Power Live Stage & Argon-4 Quantum DSP Engines:** 360° Binaural Headstage, De-Harshness Filter, Vocal Whisper Proximity, Tartini 16Hz Phantom Sub, Golden-Ratio Reverb, and 96kHz Spectral Upsampler.
            - **31-Band ISO 1/3-Octave Studio EQ + 15 Device Presets:** Real-time RTA Spectrum + YouTube & System-wide Android `DynamicsProcessing`.
          draft: false
          prerelease: false
          files: |
            release_apks/Equltra-v2.5-BassLock.apk
            release_apks/Equltra-v1.0.apk
            release_apks/Equltra.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
